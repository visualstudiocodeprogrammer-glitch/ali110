name: Daily hadith

# Optional automation. If it fails or finds nothing, the site keeps working and
# keeps showing the most recent hadith (or rotates through the curated ones).
on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be added"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-hadith
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Retrieve today's hadith
        continue-on-error: true
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then npm run daily:dry; else npm run daily; fi

      # Never publish data that does not validate; discard it instead.
      - name: Validate
        id: validate
        continue-on-error: true
        run: npm run validate

      - name: Discard changes if validation failed
        if: steps.validate.outcome == 'failure'
        run: git checkout -- data

      - name: Commit and redeploy
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "ali110-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): daily hadith $(date -u +%F)"
          git push
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the deploy explicitly.
          gh workflow run deploy.yml
